name: Release

# Push a tag like v1.2.0 to build the installer and publish it as a GitHub Release.
# The tag must match <Version> in src/Screengrabber/Screengrabber.csproj.
# "Run workflow" (manual) builds the installer as a downloadable artifact without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Check the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/Screengrabber/Screengrabber.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} doesn't match <Version>$version</Version> in Screengrabber.csproj. Bump the version, commit, then tag v<version>."
          }

      - name: Build installer
        shell: pwsh
        run: ./build-installer.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: dist/ScreengrabberSetup-*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem dist/ScreengrabberSetup-*.exe | Select-Object -First 1
          gh release create "${{ github.ref_name }}" $setup.FullName --title "Screengrabber ${{ github.ref_name }}" --generate-notes
